<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>미래애드원 관리자</title>
<link rel="icon" href="/assets/img/brand/icon-512.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 화이트 톤 하나로(다크 모드 없음) · 글꼴은 사이트와 같은 Noto Sans KR */
:root{
  color-scheme:light;
  --page:#f5f7fa;--surface:#ffffff;--ink:#111827;--ink2:#4b5563;--muted:#6b7280;--grid:#e5e7eb;--axis:#cbd2da;--ring:rgba(17,24,39,.08);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neutral:#d6d5cf;
  --good:#006300;--bad:#c03030;--warn:#fab219;
  --brand:#0042D6;--navy:#111D30;--wash:#eef3fb;
  --font:'Noto Sans KR',-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--font);word-break:keep-all;overflow-wrap:anywhere}
button,select,input{font:inherit;color:inherit}
a{color:var(--s1)}
.top{background:#fff;color:var(--ink);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--grid)}
.top__in{padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top__brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--ink2);text-decoration:none}
.top__brand img{height:26px;width:auto;display:block}
.top__brand span{padding-left:10px;border-left:1px solid var(--grid)}
.top__meta{margin-left:auto;font-size:13px;color:var(--muted)}
.top button{background:#fff;border:1px solid var(--axis);border-radius:8px;padding:6px 12px;color:var(--ink);cursor:pointer;font-size:13px;font-weight:500}
.top button:hover{border-color:var(--brand);color:var(--brand)}
/* 왼쪽 메뉴 + 본문 */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - var(--hd,52px))}
.side{flex:none;width:224px;position:sticky;top:var(--hd,52px);height:calc(100vh - var(--hd,52px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--grid);padding:12px 10px 24px}
.side nav{display:flex;flex-direction:column;gap:1px}
.side__g{margin:14px 10px 6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.side__g:first-child{margin-top:4px}
.side a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14.5px;font-weight:600}
.side a:hover{background:var(--page);color:var(--ink)}
.side a.on{background:color-mix(in srgb,var(--s1) 12%,var(--surface));color:var(--s1)}
.side__dim{display:none}
.top__menu{display:none;background:transparent!important;font-size:20px!important;padding:2px 8px!important;line-height:1}
main{flex:1;min-width:0;max-width:1240px;margin:0 auto;padding:20px 20px 64px}
.card{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--ring);padding:20px;margin-top:16px;scroll-margin-top:calc(var(--hd,52px) + 16px)}
@media (max-width:960px){
  .top__menu:not([hidden]){display:inline-block}
  .side{position:fixed;left:0;top:var(--hd,52px);bottom:0;height:auto;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .side__dim:not([hidden]){display:block;position:fixed;inset:var(--hd,52px) 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  main{padding:16px 16px 64px}
}
.card h2{margin:0;font-size:18px;letter-spacing:-.01em}
.card .sub{margin:4px 0 0;color:var(--ink2);font-size:13.5px}
.card__head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;scroll-margin-top:110px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:340px){.tiles{grid-template-columns:1fr}}
@media (max-width:480px){.tile{padding:13px}.tile__v{font-size:24px}.tile__s,.tile__d{font-size:12.5px}}
.tile{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--ring);padding:16px}
.tile__l{font-size:13.5px;color:var(--ink2);font-weight:600}
.tile__v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.tile__v small{font-size:15px;font-weight:600;color:var(--ink2);margin-left:3px}
.tile__s{font-size:13px;color:var(--ink2);margin-top:6px}
.tile__d{font-size:13px;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.flag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.flag.warn::before{background:var(--warn)}.flag.bad::before{background:#d03b3b}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:12px;height:12px;border-radius:3px}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.grid{stroke:var(--grid);stroke-width:1}
.grid.base{stroke:var(--axis)}
.tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--surface);stroke-width:2}
.endv{fill:var(--ink);font-size:12.5px;font-weight:700}
.anno{stroke:var(--axis);stroke-width:1}
.anno-t{fill:var(--muted);font-size:11.5px}
.cross{stroke:var(--axis);stroke-width:1}
.hit{cursor:crosshair}
details.table{margin-top:12px}
details.table summary{cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:600}
.tbl{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl th{color:var(--ink2);font-weight:600}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mini__c{border-radius:12px;box-shadow:0 0 0 1px var(--ring);padding:12px 12px 8px}
.mini__h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:700}
.mini__h span{font-weight:600;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mini__f{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--page);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
select{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;font-size:14px}
.hm{overflow-x:auto;margin:0 -4px}
.hm table{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:760px;width:100%}
.hm th{font-weight:600;color:var(--ink2);padding:4px 6px;text-align:center;white-space:nowrap}
.hm th.q{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:190px;white-space:normal;color:var(--ink);font-weight:600}
.hm td{height:30px;text-align:center;border-radius:4px;font-weight:700;white-space:nowrap;min-width:56px}
.hm td.c-site{background:var(--s1);color:#fff}
.hm td.c-brand{background:color-mix(in srgb,var(--s2) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--s2);color:var(--ink)}
.hm td.c-none{background:var(--page);color:var(--muted);font-weight:400}
.hm td.c-fail{background:repeating-linear-gradient(135deg,var(--page) 0 5px,var(--surface) 5px 9px);color:var(--muted);font-weight:500}
.hm td.c-na{background:transparent;color:var(--muted);font-weight:400}
.hm td.trend{min-width:110px;background:transparent;padding:0 4px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;align-items:center;gap:10px;font-size:13.5px;padding:2px 0;cursor:default}
.bar .bv small{font-weight:500;color:var(--muted);margin-left:4px;font-size:12px}
.btnlink{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btnlink:hover{filter:brightness(1.15)}
.funnel{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.fn{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:10px;font-size:14px}
.fn .bt{height:22px;position:relative;background:var(--page);border-radius:4px}
.fn .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.fn b{font-variant-numeric:tabular-nums}.fn small{color:var(--muted);margin-left:6px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:14px}
.grid3 h3,.two h3{font-size:15px;margin:0 0 8px}
@media (max-width:640px){.fn{grid-template-columns:96px 1fr 92px;font-size:13px}}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:14px;position:relative}
.bar .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.bar .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar:hover .bt i{filter:brightness(1.1)}
.note{background:var(--wash);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink2);margin-top:12px}
.segbar{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.segbar div{border-radius:4px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:12.5px;font-weight:700;overflow:hidden;white-space:nowrap;min-width:3px}
.segbar div.lt{color:#0b0b0b}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:14px}
.two h3{font-size:15px;margin:0 0 6px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:7px 0;border-bottom:1px solid var(--grid);font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.list li:last-child{border-bottom:0}
.list .w{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;min-width:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;box-shadow:0 0 0 1px var(--ring);background:var(--surface)}
.chip b{font-weight:700}
.chip.ok::before,.chip.wait::before,.chip.no::before{content:"";width:8px;height:8px;border-radius:50%}
.chip.ok::before{background:var(--s1)}.chip.wait::before{background:var(--neutral);box-shadow:inset 0 0 0 1px var(--axis)}.chip.no::before{background:#d03b3b}
.md{font-size:14px}
.md h2{font-size:17px;margin:4px 0 8px}.md h3{font-size:15px;margin:16px 0 6px}.md h4,.md h5{font-size:14px;margin:14px 0 6px}
.md p,.md ul{margin:6px 0}.md ul{padding-left:20px}
.md code{background:var(--page);padding:1px 5px;border-radius:5px;font-size:12.5px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:18px}
.pghead{margin:4px 0 14px}.pghead h1{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}.pghead .sub{margin:0;color:var(--ink2);font-size:13.5px}
#pg-ai .tiles,#pg-seo .tiles{margin-bottom:4px}
.ac-form{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.ac-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:180px;flex:1}
.ac-form input,.ac-form select{padding:9px 10px;border:1px solid var(--axis);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
.ac-form input:focus,.ac-form select:focus{outline:2px solid var(--brand);outline-offset:1px}
.ac-go{border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;padding:10px 18px;cursor:pointer;font-size:14px}
.ac-go:disabled{opacity:.45;cursor:default}
.ac-btn{border:1px solid var(--axis);background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ac-btn:hover{border-color:var(--brand);color:var(--brand)}.ac-btn.danger{color:var(--bad)}.ac-btn.danger:hover{border-color:var(--bad)}
.ac-pwrow td{background:var(--page)}
.home2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.home2 .card{margin-top:16px}
.morelink{font-size:13.5px;font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap}
.morelink:hover{text-decoration:underline}
.mini-h{font-size:13.5px;margin:14px 0 6px;color:var(--ink2)}
.mini3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 16px}
.mini3 .bar{grid-template-columns:minmax(70px,1fr) 60px 28px;font-size:12.5px}
a.tile--go{display:block;text-decoration:none;color:inherit;transition:box-shadow .15s}
a.tile--go:hover{box-shadow:0 0 0 2px var(--s1)}
.tile__l .go{float:right;font-size:12px;font-weight:600;color:var(--s1)}
.alerts{list-style:none;margin:0;padding:0}.alerts li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}.alerts li:last-child{border-bottom:0}
.alerts a{color:var(--ink);text-decoration:none}.alerts a:hover{text-decoration:underline}.alerts .flag::before{margin-right:0}
.flag.info::before{background:var(--axis)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring),0 8px 24px rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;font-size:13px;max-width:320px;line-height:1.45}
#tip .tr{display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap}
#tip .tr i{width:10px;height:10px;border-radius:3px;flex:none}
#tip .tr b{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
#tip .dm{color:var(--ink2);margin-top:4px;white-space:normal}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--ring),0 12px 40px rgba(17,24,39,.06);padding:32px 28px 28px}
.login h1{font-size:20px;margin:0 0 4px;text-align:center}
#login>p{text-align:center}
body.is-login .top{display:none}
body.is-login{background:linear-gradient(180deg,#fff 0,var(--page) 100%)}
.login p{margin:0 0 18px;color:var(--ink2);font-size:14px}
.login label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--axis);border-radius:10px;background:var(--surface);font-size:16px}
.login input:focus{outline:2px solid var(--s1);outline-offset:1px}
.login__logo{display:block;height:44px;width:auto;margin:2px auto 22px}
.login button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.login button:disabled{opacity:.6;cursor:wait}
.login .err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:20px}
.msg{max-width:560px;margin:10vh auto 0;background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--ring);padding:28px;font-size:14.5px}
.msg h1{font-size:19px;margin:0 0 8px}
@media (max-width:640px){
  .card{padding:16px;border-radius:14px}
  .tile__v{font-size:26px}
  .bar{grid-template-columns:minmax(96px,132px) 1fr 36px;font-size:13px}
  .hm th.q{min-width:104px;font-size:12px}
  .top__meta{order:3;width:100%;margin-left:0}
}
@media print{.top,.subnav{position:static}}
</style>
</head>
<body>
<header class="top"><div class="top__in">
  <button type="button" class="top__menu" id="menuBtn" aria-label="메뉴 열기" aria-controls="side" aria-expanded="false" hidden>☰</button>
  <a class="top__brand" href="#home"><img src="/assets/img/brand/logo.png" alt="미래애드원" width="98" height="26"><span>관리자</span></a>
  <div class="top__meta" id="asof"></div>
  <button type="button" id="logout" hidden>로그아웃</button>
</div></header>

<div class="shell">
<aside class="side" id="side" hidden aria-label="관리자 메뉴">
  <nav>
    <p class="side__g">개요</p>
    <a href="#home" data-page="home">대시보드</a>
    <p class="side__g">고객·전환</p>
    <a href="#conv" data-page="conv">방문·전환</a>
    <a href="#leads" data-page="leads">문의</a>
    <p class="side__g">검색 노출·콘텐츠</p>
    <a href="#ai" data-page="ai">AI·검색 노출</a>
    <a href="#seo" data-page="seo">콘텐츠·SEO</a>
    <p class="side__g" data-master>운영</p>
    <a href="#ops" data-page="ops" data-master>자동 측정 기록</a>
    <a href="#acct" data-page="acct" data-master>계정 관리</a>
    <p class="side__g">바로가기</p>
    <a href="/" target="_blank" rel="noopener">사이트 열기 ↗</a>
    <a href="#" id="sideSheet" target="_blank" rel="noopener noreferrer" hidden>문의 시트 열기 ↗</a>
  </nav>
</aside>
<div class="side__dim" id="sideDim" hidden></div>
<main id="main">
  <section class="login" id="login" hidden>
    <img class="login__logo" src="/assets/img/brand/logo.png" alt="미래애드원" width="165" height="44">
    <h1>관리자 로그인</h1>
    <p id="loginNote">측정 결과는 로그인한 뒤에만 보입니다.</p>
    <form id="loginForm" autocomplete="on">
      <label for="uid">아이디</label>
      <input type="text" id="uid" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="pw" style="margin-top:12px">비밀번호</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">로그인</button>
      <div class="err" id="loginErr" role="alert"></div>
    </form>
  </section>
  <section class="login" id="keybox" hidden>
    <h1>측정 데이터 열기</h1>
    <p>측정 데이터는 암호화돼 있어 데이터 키가 있어야 열립니다. 이 PC의 <code>4. 미래애드원/.admin-data-key</code> 파일(메모장으로 열기)에 있는 한 줄을 그대로 붙여 넣어 주세요. 키는 이 브라우저 안에서만 쓰이고 서버로 보내지 않습니다.</p>
    <form id="keyForm" autocomplete="off">
      <label for="dkey">데이터 키</label>
      <input type="password" id="dkey" autocomplete="off" spellcheck="false" required>
      <label class="chk" style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:500"><input type="checkbox" id="dkeySave" checked style="width:auto">이 브라우저에 기억하기(공용 PC에서는 끄세요)</label>
      <button type="submit" id="keyBtn">열기</button>
      <div class="err" id="keyErr" role="alert"></div>
    </form>
  </section>
  <section class="msg" id="msg" hidden></section>
  <div id="dash" hidden></div>
</main>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const fmtDK = d => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
const num = n => Number(n).toLocaleString('ko-KR');
const SITE_RE = /mirae-?adone/i;

// ── 툴팁(한 개를 같이 씀): data-tip="<키>" 요소 위에 올리면 TIPS 의 내용을 보여 준다
const tip = $('#tip');
const TIPS = new Map();
let tipSeq = 0;
const addTip = html => { const k = 't' + (++tipSeq); TIPS.set(k, html); return k; };
function showTip(html, cx, cy) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let l = cx + 14, t = cy + 16;
  if (l + r.width > innerWidth - 8) l = cx - r.width - 14;
  if (t + r.height > innerHeight - 8) t = cy - r.height - 14;
  tip.style.left = Math.max(8, l) + 'px'; tip.style.top = Math.max(8, t) + 'px';
}
const hideTip = () => { tip.hidden = true; };
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && TIPS.has(el.dataset.tip)) showTip(TIPS.get(el.dataset.tip), e.clientX, e.clientY);
  else if (!e.target.closest || !e.target.closest('.hit')) hideTip();
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && TIPS.has(el.dataset.tip)) showTip(TIPS.get(el.dataset.tip), e.clientX, e.clientY);
});
addEventListener('scroll', hideTip, { passive: true });
// 머리글 높이(휴대폰에서는 두 줄) → 구역 메뉴가 그 아래에 붙도록
const setHd = () => document.documentElement.style.setProperty('--hd', $('.top').offsetHeight + 'px');
setHd(); addEventListener('resize', setHd);

// ── 눈금
function niceTicks(max, n = 4) {
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw));
  const step = Math.max(1, [1, 2, 5, 10].map(s => s * p).find(s => s >= raw));
  const top = Math.ceil(max / step) * step;
  return Array.from({ length: Math.round(top / step) + 1 }, (_, i) => i * step);
}
// 가로축 날짜 눈금: 처음·마지막은 늘 넣고, 사이 날짜는 화면에서 gap(px) 이상 떨어진 것만(날짜 간격이 고르지 않아서)
function pickTicks(n, x, gap) {
  if (n < 2) return n ? [0] : [];
  const out = [0];
  for (let i = 1; i < n - 1; i++) if (x(i) - x(out[out.length - 1]) >= gap && x(n - 1) - x(i) >= gap) out.push(i);
  out.push(n - 1);
  return out;
}
const lastIdx = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };

// ── 선 그래프(전체 크기 / 작은 추이선). 가로축은 실제 날짜 간격, 측정 없는 날은 선을 끊는다
function lineChart(host, o) {
  const { dates, series, compact = false, annotations = [], tipExtra, unit = '건', label = '' } = o;
  const height = o.height || (compact ? 34 : 232);
  const T = dates.map(d => Date.parse(d + 'T00:00:00Z'));
  let lastW = 0;
  function draw() {
    const W = Math.round(host.clientWidth);
    if (!W || W === lastW) return;
    lastW = W;
    const H = height;
    const m = compact ? { l: 4, r: 8, t: 6, b: 6 } : { l: 34, r: 36, t: 24, b: 26 };
    const pw = Math.max(10, W - m.l - m.r), ph = H - m.t - m.b;
    const t0 = T[0], t1 = T.length > 1 ? T[T.length - 1] : t0 + 864e5;
    const x = i => m.l + (T.length > 1 ? (T[i] - t0) / (t1 - t0) * pw : pw / 2);
    const vals = series.flatMap(s => s.values).filter(v => v != null);
    const ticks = niceTicks(Math.max(1, o.yMax || 0, ...vals)); // yMax: 작은 그래프끼리 같은 눈금으로 비교
    const top = ticks[ticks.length - 1];
    const y = v => m.t + (1 - v / top) * ph;
    let s = '';
    if (!compact) {
      for (const tv of ticks) s += `<line class="grid${tv === 0 ? ' base' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(tv)}" y2="${y(tv)}"/><text class="tick" x="${m.l - 8}" y="${y(tv) + 4}" text-anchor="end">${num(tv)}</text>`;
      for (const i of pickTicks(T.length, x, 46))
        s += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="${T.length > 1 && i === 0 ? 'start' : T.length > 1 && i === T.length - 1 ? 'end' : 'middle'}">${fmtD(dates[i])}</text>`;
      for (const a of annotations) {
        const i = dates.indexOf(a.date); if (i < 0) continue;
        const ax = x(i), right = ax > W - 150;
        s += `<line class="anno" x1="${ax}" x2="${ax}" y1="${m.t - 10}" y2="${H - m.b}"/><text class="anno-t" x="${right ? ax - 5 : ax + 5}" y="${m.t - 12}" text-anchor="${right ? 'end' : 'start'}">${esc(a.text)}</text>`;
      }
    }
    for (const se of series) {
      let d = '', pen = false;
      se.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      s += `<path class="ln" d="${d}" style="stroke:var(--${se.color})"/>`;
      se.values.forEach((v, i) => {
        if (v == null) return;
        const isolated = (i === 0 || se.values[i - 1] == null) && (i === se.values.length - 1 || se.values[i + 1] == null);
        if (!compact || isolated || i === lastIdx(se.values)) s += `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="4" style="fill:var(--${se.color})"/>`;
      });
    }
    if (!compact) {
      const ends = series.map(se => { const i = lastIdx(se.values); return i < 0 ? null : { i, v: se.values[i], yy: y(se.values[i]) }; }).filter(Boolean);
      const collide = ends.some((a, k) => ends.some((b, j) => j > k && Math.abs(a.yy - b.yy) < 14));
      if (!collide) for (const e of ends) s += `<text class="endv" x="${x(e.i) + 9}" y="${e.yy + 4}">${num(e.v)}</text>`;
    }
    s += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/><g class="hl"></g><rect class="hit" x="${m.l - 8}" y="0" width="${pw + 16}" height="${H}" fill="transparent"/>`;
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${s}</svg>`;
    const svg = host.firstChild, cross = svg.querySelector('.cross'), hl = svg.querySelector('.hl'), hit = svg.querySelector('.hit');
    const move = ev => {
      const px = ev.clientX - svg.getBoundingClientRect().left;
      let bi = 0, bd = Infinity;
      T.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; bi = i; } });
      cross.setAttribute('x1', x(bi)); cross.setAttribute('x2', x(bi)); cross.setAttribute('visibility', 'visible');
      hl.innerHTML = series.map(se => se.values[bi] == null ? '' : `<circle class="dot" cx="${x(bi)}" cy="${y(se.values[bi])}" r="5.5" style="fill:var(--${se.color})"/>`).join('');
      showTip(`<b>${fmtDK(dates[bi])}</b>` + series.map(se => `<div class="tr"><i style="background:var(--${se.color})"></i>${esc(se.name)}<b>${se.values[bi] == null ? '측정 없음' : num(se.values[bi]) + unit}</b></div>`).join('') + (tipExtra ? tipExtra(bi) : ''), ev.clientX, ev.clientY);
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hl.innerHTML = ''; hideTip(); });
  }
  draw();
  new ResizeObserver(() => requestAnimationFrame(draw)).observe(host);
}

// ── 간단한 마크다운(서치콘솔 판독 메모용): 제목·목록·표·굵게·코드
function md(src) {
  const L = String(src).replace(/\r/g, '').split('\n');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  let out = '', list = false, i = 0;
  const close = () => { if (list) { out += '</ul>'; list = false; } };
  while (i < L.length) {
    const l = L[i]; let mm;
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{3,}/.test(L[i + 1] || '')) {
      close();
      const head = cells(l); i += 2; let body = '';
      while (i < L.length && /^\s*\|/.test(L[i])) { body += '<tr>' + cells(L[i]).map((c, k) => `<td${k && /^[\d.,%천만\s|-]+$/.test(c) ? ' class="n"' : ''}>${inline(c)}</td>`).join('') + '</tr>'; i++; }
      out += `<div class="tbl"><table><thead><tr>${head.map((c, k) => `<th${k ? ' class="n"' : ''}>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
      continue;
    }
    if ((mm = l.match(/^(#{1,4})\s+(.*)/))) { close(); const lv = Math.min(mm[1].length + 1, 5); out += `<h${lv}>${inline(mm[2])}</h${lv}>`; }
    else if ((mm = l.match(/^\s*[-*]\s+(.*)/))) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(mm[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
    i++;
  }
  close();
  return out;
}

// ── 데이터 모양 잡기
function model(D) {
  const E = D.engines.map(([id, name]) => ({ id, name }));
  const Q = D.ai.queries, dates = D.ai.dates;
  const rows = D.ai.rows.map(([d, e, q, site, brand, fail, err, dom]) => ({ d, e, q, site, brand, fail, err, dom: dom ? dom.split('|').filter(Boolean) : [] }));
  const byDate = dates.map((_, i) => rows.filter(r => r.d === i));
  const cell = new Map(rows.map(r => [`${r.d}|${r.e}|${r.q}`, r]));
  const daily = dates.map((date, i) => {
    const rs = byDate[i], ok = rs.filter(r => !r.fail);
    return { date, tried: rs.length, ok: ok.length, site: ok.filter(r => r.site).length, brand: ok.filter(r => r.brand).length };
  });
  // 같은 엔진×검색어끼리 비교(측정 범위가 늘어도 공정하게)
  function compare(i, j) {
    if (i < 0 || j < 0 || i === j) return null;
    const B = new Map(byDate[j].filter(r => !r.fail).map(r => [r.e + '|' + r.q, r]));
    let n = 0, site = 0, brand = 0;
    for (const a of byDate[i]) { if (a.fail) continue; const b = B.get(a.e + '|' + a.q); if (!b) continue; n++; site += a.site - b.site; brand += a.brand - b.brand; }
    return n ? { n, site, brand } : null;
  }
  // 측정 범위가 늘어난 날(새 검색어·새 엔진)
  const firstQ = new Map(), firstE = new Map();
  for (const r of rows) { if (!firstQ.has(r.q) || firstQ.get(r.q) > r.d) firstQ.set(r.q, r.d); if (!firstE.has(r.e) || firstE.get(r.e) > r.d) firstE.set(r.e, r.d); }
  const annotations = [];
  dates.forEach((date, i) => {
    if (!i) return;
    const nq = [...firstQ].filter(([, d]) => d === i).length, ne = [...firstE].filter(([, d]) => d === i).map(([e]) => E[e]?.name);
    if (nq || ne.length) annotations.push({ date, text: [nq ? `검색어 +${nq}` : '', ne.length ? `${ne.join('·')} 추가` : ''].filter(Boolean).join(' · ') });
  });
  return { E, Q, dates, rows, byDate, cell, daily, compare, annotations };
}

const deltaHtml = (v, label) => v == null ? '' :
  `<span><span class="delta ${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '▲ +' + v : v < 0 ? '▼ ' + v : '변화 없음'}</span> <span class="muted">${esc(label)}</span></span>`;

// ── 방문·전환(GA4 일별) / 문의 취합(상담 시트)
const topN = (o, n = 8) => Object.entries(o || {}).filter(([k]) => k).sort((a, b) => b[1] - a[1]).slice(0, n);
function barsHtml(o, n = 8, unit = '건') {
  const rows = topN(o, n), max = rows.length ? rows[0][1] : 1;
  return rows.length ? `<div class="bars">${rows.map(([k, v]) => `<div class="bar" data-tip="${addTip(`<b>${esc(k)}</b><div class="dm">${v}${unit}</div>`)}"><span class="bl">${esc(k)}</span><span class="bt"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="bv">${num(v)}</span></div>`).join('')}</div>` : '<p class="muted">없음</p>';
}
const pctTxt = (a, b) => (b ? `${Math.round(a / b * 1000) / 10}%` : '—');
function renderConv(D) {
  const host = $('#conv');
  const days = (D.ga4 || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!days.length) { host.innerHTML = '<p class="muted">아직 GA4 일별 데이터가 없습니다. 다음 자동 측정 뒤 채워집니다.</p>'; return; }
  const sumOf = (list, f) => list.reduce((a, d) => a + (f(d) || 0), 0);
  const ev = (list, k, i = 0) => sumOf(list, d => d.events?.[k]?.[i]);
  const draw = w => {
    const n = w === 'all' ? days.length : Math.min(+w, days.length);
    const sel = days.slice(-n), prev = w === 'all' ? [] : days.slice(-2 * n, -n);
    const U = sumOf(sel, d => d.users), S = sumOf(sel, d => d.sessions), E = sumOf(sel, d => d.engaged);
    const quote = ev(sel, 'open_quote'), fstart = ev(sel, 'form_start'), lead = ev(sel, 'generate_lead'), tel = ev(sel, 'click_tel'), kakao = ev(sel, 'click_kakao');
    const uAvg = U / sel.length, pAvg = prev.length === n ? sumOf(prev, d => d.users) / n : null;
    const leadPrev = prev.length === n ? ev(prev, 'generate_lead') : null;
    const label = `${fmtD(sel[0].date)}~${fmtD(sel.at(-1).date)} · ${sel.length}일`;
    const ch = {};
    for (const d of sel) for (const [k, v] of Object.entries(d.channels || {})) { ch[k] = ch[k] || [0, 0]; ch[k][0] += v[0]; ch[k][1] += v[1]; }
    const chRows = Object.entries(ch).sort((a, b) => b[1][0] - a[1][0]);
    const fn = [['세션(방문)', S], ['상담 창 열기', quote], ['폼 입력 시작', fstart], ['상담 신청 접수', lead]];
    const months = Object.entries(D.ga4Months || {}).sort();
    host.innerHTML = `
      <div class="tiles" style="margin-bottom:16px">
        <div class="tile"><div class="tile__l">방문자(일별 합)</div><div class="tile__v">${num(U)}<small>명</small></div><div class="tile__s">${label} · 하루 평균 ${uAvg.toFixed(1)}명</div><div class="tile__d">${pAvg != null ? deltaHtml(Math.round((uAvg - pAvg) * 10) / 10, `직전 ${n}일 하루 평균(${pAvg.toFixed(1)}명) 대비`) : ''}</div></div>
        <div class="tile"><div class="tile__l">세션</div><div class="tile__v">${num(S)}</div><div class="tile__s">참여 세션 ${num(E)}(${pctTxt(E, S)})</div></div>
        <div class="tile"><div class="tile__l">상담 신청 접수</div><div class="tile__v">${num(lead)}<small>건</small></div><div class="tile__s">세션 대비 전환율 ${pctTxt(lead, S)}</div><div class="tile__d">${leadPrev != null ? deltaHtml(lead - leadPrev, `직전 ${n}일 대비`) : ''}</div></div>
        <div class="tile"><div class="tile__l">상담 창 열기</div><div class="tile__v">${num(quote)}<small>회</small></div><div class="tile__s">폼 입력 시작 ${num(fstart)}회</div></div>
        <div class="tile"><div class="tile__l">전화·카톡 버튼</div><div class="tile__v">${num(tel + kakao)}<small>회</small></div><div class="tile__s">전화 ${num(tel)} · 카카오톡 ${num(kakao)}</div></div>
        <div class="tile"><div class="tile__l">전체 문의 행동</div><div class="tile__v">${num(lead + tel + kakao)}<small>회</small></div><div class="tile__s">접수 + 전화 + 카톡 · 세션 대비 ${pctTxt(lead + tel + kakao, S)}</div></div>
      </div>
      <h3 style="font-size:15px;margin:0 0 8px">전환 단계(${label})</h3>
      <div class="funnel">${fn.map(([k, v]) => `<div class="fn"><span>${k}</span><span class="bt"><i style="width:${(S ? Math.min(100, v / S * 100) : 0).toFixed(1)}%"></i></span><span><b>${num(v)}</b><small>${k.startsWith('세션') ? '' : pctTxt(v, S)}</small></span></div>`).join('')}</div>
      <p class="muted" style="font-size:12.5px;margin:4px 0 0">상담 페이지 폼에서 바로 신청하는 경우도 있어 뒤 단계 수가 앞 단계보다 클 수 있습니다. 비율은 모두 세션 대비입니다.</p>
      <div class="two" style="margin-top:18px">
        <div><h3>하루 방문자</h3><div class="chart" id="cvU"></div></div>
        <div><h3>하루 상담 행동</h3><div class="legend" style="margin-bottom:4px"><span><i style="background:var(--s1)"></i>상담 창 열기</span><span><i style="background:var(--s2)"></i>폼 입력 시작</span><span><i style="background:var(--s3)"></i>접수</span></div><div class="chart" id="cvA"></div></div>
      </div>
      <div class="two" style="margin-top:18px">
        <div><h3>채널별 세션</h3><div class="tbl"><table><thead><tr><th>채널</th><th class="n">세션</th><th class="n">비중</th><th class="n">참여율</th></tr></thead><tbody>${chRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${num(v[0])}</td><td class="n">${pctTxt(v[0], S)}</td><td class="n">${pctTxt(v[1], v[0])}</td></tr>`).join('')}</tbody></table></div></div>
        <div><h3>월 방문자(고유)</h3><div class="tbl"><table><thead><tr><th>월</th><th class="n">방문자</th><th class="n">일수</th><th class="n">하루 평균</th><th class="n">전월 대비</th></tr></thead><tbody>${months.map(([m, v], i) => { const a = v.users / v.days, p = i ? months[i - 1][1].users / months[i - 1][1].days : null; return `<tr><td>${esc(m)} <span class="muted" style="font-size:12px">${fmtD(v.from)}~${fmtD(v.to)}</span></td><td class="n">${num(v.users)}</td><td class="n">${v.days}</td><td class="n">${a.toFixed(1)}</td><td class="n">${p ? `<span class="delta ${a >= p ? 'up' : 'down'}">${a >= p ? '+' : ''}${Math.round((a - p) / p * 100)}%</span>` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
        <p class="muted" style="font-size:12px">달이 다 차지 않은 달은 하루 평균으로 비교합니다.</p></div>
      </div>`;
    const ds = sel.map(d => d.date);
    lineChart($('#cvU'), { dates: ds, height: 200, unit: '명', label: '하루 방문자', series: [{ name: '방문자', color: 's1', values: sel.map(d => d.users) }], tipExtra: i => `<div class="dm">세션 ${sel[i].sessions}</div>` });
    lineChart($('#cvA'), { dates: ds, height: 200, unit: '회', label: '하루 상담 행동', series: [{ name: '상담 창 열기', color: 's1', values: sel.map(d => d.events?.open_quote?.[0] || 0) }, { name: '폼 입력 시작', color: 's2', values: sel.map(d => d.events?.form_start?.[0] || 0) }, { name: '접수', color: 's3', values: sel.map(d => d.events?.generate_lead?.[0] || 0) }] });
  };
  draw('30');
  $('#convWin').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('#convWin').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    draw(b.dataset.w);
  });
}

// 임시 계정 상태(또는 서버에 키가 없을 때)는 서버가 암호문을 그대로 보낸다 → 사용자가 붙여 넣은 데이터 키로 브라우저에서 푼다
// 형식: 'MAD1' + iv(12) + tag(16) + 암호문(AES-256-GCM, AAD 'mirae-admin-data') → gzip JSON (tools/admin/crypto.mjs 와 같음)
const KEY_STORE = 'ma_admin_data_key';
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch { return ''; } };
const setKey = v => { try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch { } };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openBlob(encB64, keyB64) {
  const raw = fromB64(String(keyB64).trim());
  if (raw.length !== 32) throw new Error('key');
  const buf = fromB64(encB64);
  if (new TextDecoder().decode(buf.slice(0, 4)) !== 'MAD1') throw new Error('format');
  const ct = buf.slice(32), withTag = new Uint8Array(ct.length + 16);
  withTag.set(ct); withTag.set(buf.slice(16, 32), ct.length);
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(4, 16), additionalData: new TextEncoder().encode('mirae-admin-data') }, key, withTag);
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}

    show(D);
  } catch (err) {
    $('#keyErr').textContent = err.message === 'browser' ? '이 브라우저에서는 열 수 없습니다. 크롬·엣지 최신 버전에서 열어 주세요.' : '키가 맞지 않습니다. .admin-data-key 파일의 한 줄 전체를 그대로 붙여 넣어 주세요.';
  }
  btn.disabled = false;
});
function showLogin(state) {
  document.body.classList.add('is-login'); // 로그인 전: 위 머리글 없이 로고가 있는 로그인 카드만
  $('#dash').hidden = true; $('#msg').hidden = true; $('#keybox').hidden = true; $('#logout').hidden = true; $('#asof').textContent = '';
  $('#side').hidden = true; $('#menuBtn').hidden = true; sideOpen(false);
  $('#login').hidden = false;
  const setup = state === 'setup';
  $('#loginNote').innerHTML = setup ? '관리자 비밀번호가 아직 설정되지 않았습니다. Railway → Variables 에 <code>ADMIN_PASSWORD</code> 를 넣으면 로그인할 수 있습니다.' : '측정 결과는 로그인한 뒤에만 보입니다.';
  $('#loginForm').hidden = setup;
  if (!setup) ($('#uid').value ? $('#pw') : $('#uid')).focus();
}
function showMsg(code) {
  const [t, b] = MSG[code] || MSG.error;
  $('#login').hidden = true; $('#dash').hidden = true; $('#keybox').hidden = true;
  $('#msg').innerHTML = `<h1>${t}</h1><p>${b}</p>`; $('#msg').hidden = false;
  DATA_STATE = 'msg'; applyView();
}
async function boot() {
  let r;
  try { r = await fetch('api/data', { credentials: 'same-origin', cache: 'no-store' }); } catch { return showMsg('error'); }
  if (r.status === 401) return showLogin();
  if (r.status === 503) { const j = await r.json().catch(() => ({})); $('#logout').hidden = j.error === 'setup'; return j.error === 'setup' ? showLogin('setup') : showMsg(j.error); }
  if (!r.ok) return showMsg('error');
  const D = await r.json();
  ROLE = D.role === 'client' ? 'client' : 'master';
  if (D.encrypted) {
    ENC = D.encrypted; TEMP = !!D.temp;
    const k = getKey();
    if (k) { try { return show(await openBlob(ENC, k)); } catch { setKey(''); return showKeyBox('저장된 데이터 키가 맞지 않아 지웠습니다. 다시 붙여 넣어 주세요.'); } }
    return showKeyBox();
  }
  TEMP = false;
  show(D);
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ username: $('#uid').value, password: $('#pw').value }) });
    if (r.ok) { $('#pw').value = ''; await boot(); }
    else {
      const j = await r.json().catch(() => ({}));
      $('#pw').value = ''; $('#pw').focus();
      err.textContent = j.error === 'locked' ? '로그인 시도가 많아 15분 동안 막혔습니다. 잠시 뒤 다시 시도해 주세요.' : j.error === 'setup' ? '관리자 비밀번호가 아직 설정되지 않았습니다.' : '아이디 또는 비밀번호가 맞지 않습니다.';
    }
  } catch { err.textContent = '서버에 연결하지 못했습니다.'; }
  btn.disabled = false;
});
$('#logout').addEventListener('click', async () => {
  await fetch('api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }).catch(() => {});
  showLogin();
});
boot();
})();
</script>
